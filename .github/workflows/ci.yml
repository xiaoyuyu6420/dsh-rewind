name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # engines 声称 node >=20,就实测 20 与 22。
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: node --check index.js && node --check client.js

      - name: Host unit tests
        run: node scripts/test-host.mjs --strict

      - name: Client static guard
        run: node scripts/check-client-static.mjs --strict

      # 契约守卫在 CI 里没有 DSH 安装 → 明确 SKIP(非 strict),有 DSH 的机器上跑才是硬门禁。
      - name: Runtime contract guard (skips without a DSH install)
        run: node scripts/check-runtime-contract.mjs
